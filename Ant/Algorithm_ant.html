<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Муравьиный Алгоритм</title>
  <link rel="stylesheet" href="ant_alg.css">
  <link rel="icon" href="../logo/icon.png" type="image/png">
</head>
<body>
  <header class="page-header">
    <div class="container-header">
      <div class="logo">
        <img src="../logo/icon.png" alt="Algorithm Visualizer Logo" />
        <span>Algorithm Visualizer</span>
      </div>
    </div>
</header>
  <div class="container">
    <h1>Муравьиный Алгоритм</h1>

    <div class="controls">
      <button id="startButton">Запустить алгоритм</button>
      <button id="animatePathButton">Показать анимацию</button>
      <button id="clearButton">Очистить</button>
      <button id="resetPheromonesButton">Сбросить феромоны</button>
      <label for="autoRun">Автоматически запускать при добавлении точек</label>
      <input type="checkbox" id="autoRun" checked>
    </div>
    <div class="bottom-bar" id="bottomBar">
      <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()">☰</button>
      <div class="menu-content" id="menuContent">
        <div class="menu-section">
          <button class="main-menu-button" onclick="document.location='../Main_site/index.html'">Главное меню</button>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-section algo-buttons">
          <button class="algo-button" onclick="location.href='../First_alg_A/First_alg_A.html'">A*</button>
          <button class="algo-button" onclick="location.href='../Clustering/cluster.html'">Кластеризация</button>
          <button class="algo-button" onclick="location.href='../Genetic/Genetic_alg.html'">Генетический алгоритм</button>
          <button class="algo-button current">Муравьиный алгоритм</button>
          <button class="algo-button" onclick="location.href='../Decision_tree/Tree.html'">Дерево решений</button>
          <button class="algo-button" onclick="location.href='../Neural_network/Neural_network.html'">Нейронная сеть</button>
          <button class="algo-button" onclick="location.href='../Hybrid_GA_NN/hybrid.html'">Гибридный: ГА + НС</button>
          <button class="algo-button" onclick="location.href='../Hybrid_ACO_NN/hybrid_ant.html'">Гибридный: МА + НС</button>
        </div>
      </div>
    </div>

    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="pathLengthDisplay"></div>
  </div>
  <footer class="footer">
    <p>© 2025 Algorithm Visualizer</p>
  </footer>

  <script src="ant_alg.js"></script>
  <script>
    function toggleMenu() {
      const menuContent = document.getElementById('menuContent');
      const menuToggle = document.getElementById('menuToggle');
      if (menuContent) {
        const isActive = menuContent.classList.toggle('active');
        if (menuToggle) {
          if (isActive) {
            menuToggle.style.bottom = '80px';
          } else {
            menuToggle.style.bottom = '15px';
          }
        }
      }
    }

    document.addEventListener('click', (e) => {
      const bottomBar = document.getElementById('bottomBar');
      const menuToggle = document.getElementById('menuToggle');
      const menuContent = document.getElementById('menuContent');
      
      if (bottomBar && menuContent && menuContent.classList.contains('active')) {
        if (!bottomBar.contains(e.target) && e.target !== menuToggle) {
          menuContent.classList.remove('active');
          if (menuToggle) {
            menuToggle.style.bottom = '15px';
          }
        }
      }
    });
  </script>
  <script src="../common/page-transitions.js"></script>
</body>
