<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генетический Алгоритм</title>
  <link rel="stylesheet" href="alg_Genetic.css">
  <link rel="icon" href="../logo/icon.png" type="image/png">
</head>
<body>
  <header class="page-header">
    <div class="container-header">
      <div class="logo">
        <img src="../logo/icon.png" alt="Algorithm Visualizer Logo" />
        <span>Algorithm Visualizer</span>
      </div>
    </div>
</header>
  <div class="container">
    <h1 class="title">Генетический Алгоритм</h1>

    <div id="coordinates">X: 0, Y: 0</div>

    <div class="controls">
      <button id="startButton">Старт</button>
      <button id="clearButton">Очистить</button>
      <button id="multiRunBtn">5 запусков</button>
      <button id="toggleDistancesBtn">Скрыть длины</button>
    </div>

    <div class="bottom-bar" id="bottomBar">
      <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()">☰</button>
      <div class="menu-content" id="menuContent">
        <div class="menu-section">
          <button class="main-menu-button" onclick="document.location='../Main_site/index.html'">Главное меню</button>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-section algo-buttons">
          <button class="algo-button" onclick="location.href='../First_alg_A/First_alg_A.html'">A*</button>
          <button class="algo-button" onclick="location.href='../Clustering/cluster.html'">Кластеризация</button>
          <button class="algo-button current">Генетический алгоритм</button>
          <button class="algo-button" onclick="location.href='../Ant/Algorithm_ant.html'">Муравьиный алгоритм</button>
          <button class="algo-button" onclick="location.href='../Decision_tree/Tree.html'">Дерево решений</button>
          <button class="algo-button" onclick="location.href='../Neural_network/Neural_network.html'">Нейронная сеть</button>
          <button class="algo-button" onclick="location.href='../Hybrid_GA_NN/hybrid.html'">Гибридный алгоритм</button>
        </div>
      </div>
    </div>

    <div id="statusLabel">Готов к запуску</div>
    <div  class="canvas-container">
      <canvas id="canvas" width="700" height="600"></canvas>
    <section class="section-plot">
      <canvas id="plotCanvas" width="400" height="600"></canvas>
    </section>
    </div>
  </div>

  <footer class="footer">
    <p>© 2025 Algorithm Visualizer</p>
  </footer>

  <script src="alg_Genetic.js"></script>
  <script>
    // Функция для переключения меню
    function toggleMenu() {
      const menuContent = document.getElementById('menuContent');
      const menuToggle = document.getElementById('menuToggle');
      if (menuContent) {
        const isActive = menuContent.classList.toggle('active');
        // Поднимаем/опускаем кнопку вместе с меню
        if (menuToggle) {
          if (isActive) {
            menuToggle.style.bottom = '80px';
          } else {
            menuToggle.style.bottom = '15px';
          }
        }
      }
    }

    // Закрытие меню при клике вне его
    document.addEventListener('click', (e) => {
      const bottomBar = document.getElementById('bottomBar');
      const menuToggle = document.getElementById('menuToggle');
      const menuContent = document.getElementById('menuContent');
      
      if (bottomBar && menuContent && menuContent.classList.contains('active')) {
        if (!bottomBar.contains(e.target) && e.target !== menuToggle) {
          menuContent.classList.remove('active');
          // Опускаем кнопку обратно
          if (menuToggle) {
            menuToggle.style.bottom = '15px';
          }
        }
      }
    });
  </script>
  <script src="../common/page-transitions.js"></script>
</body>

</html>
